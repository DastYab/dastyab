name: Release

# Automatic release builder. Triggered by pushing a `v*` tag (e.g. v0.1.0).
# Builds the full workspace natively on each target runner and publishes a
# GitHub Release containing .deb installers (Linux), .exe / portable zip
# (Windows), raw binaries for all platforms, and a SHA256SUMS.txt file.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${V}"

  build:
    name: build-${{ matrix.artifact }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64
            arch: amd64
            deb: true
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            arch: arm64
            deb: true
          - os: windows-latest
            artifact: windows-amd64
            arch: amd64
            exe: true
            zip: true
          - os: macos-latest
            artifact: macos-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (GUI/egui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.artifact }}-release-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.artifact }}-release-cargo-

      - name: Stamp release version into Cargo workspace
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          perl -0pi -e 's/(\[workspace\.package\][^\[]*?\nversion\s*=\s*)"[^"]*"/${1}"'"$V"'"/' Cargo.toml
          grep -n -A3 '^\[workspace.package\]' Cargo.toml
          grep -q "^version = \"$V\"" Cargo.toml || { echo "version stamp failed" >&2; exit 1; }

      - name: Build workspace (release)
        run: cargo build --release --workspace

      - name: Fetch cargo-deb
        if: matrix.deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build .deb (CLI)
        if: matrix.deb
        run: |
          cargo deb -p dastyab-cli --no-build
          ls -la target/debian/

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BASE="${{ matrix.artifact }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          for bin in dastyab dastyab-tui dastyab-gui; do
            cp "target/release/${bin}${EXT}" "dist/${bin}-${BASE}${EXT}"
          done
          # Ship the helper scripts, so `dastyab aistudio` works from a bare
          # binary download: the CLI looks for them beside the executable.
          cp dastyab-aistudio.py dist/ 2>/dev/null || true
          cp dastyab-aistudio-cleanip.py dist/ 2>/dev/null || true
          cp dastyab-aistudio.sh dist/ 2>/dev/null || true
          cp dastyab-flow.py dist/ 2>/dev/null || true
          if [ "${{ matrix.deb }}" = "true" ]; then
            deb_file=$(ls target/debian/*_${{ matrix.arch }}.deb 2>/dev/null | head -n1)
            if [ -z "$deb_file" ]; then
              echo "ERROR: no .deb found for arch ${{ matrix.arch }}"
              ls -la target/debian/ || true
              exit 1
            fi
            cp "$deb_file" "dist/dastyab-${BASE}.deb"
          fi
          if [ "${{ matrix.zip }}" = "true" ]; then
            python scripts/bundle_windows.py "${{ matrix.artifact }}"
          fi
          ls -la dist/

      - name: Upload release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dastyab-release-${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error

  build-apk:
    name: build-apk (tested Android app)
    needs: version
    uses: ./.github/workflows/android-apk.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Create GitHub release
    needs:
      - build
      - build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
