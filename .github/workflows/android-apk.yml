name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/android-build-native.sh'
      - 'scripts/android-verify-apk.sh'
      - 'scripts/android-emulator-smoke.sh'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/android-build-native.sh'
      - 'scripts/android-verify-apk.sh'
      - 'scripts/android-emulator-smoke.sh'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Release version to stamp into the APK (e.g. v0.8.2). Empty keeps build.gradle.kts as is.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Stamp release version into the APK
        if: ${{ inputs.version != '' }}
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          V="${V#v}"
          CORE="${V%%-*}"
          IFS=. read -r MA MI PA <<< "$CORE"
          CODE=$(( 10#${MA:-0} * 10000 + 10#${MI:-0} * 100 + 10#${PA:-0} ))
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"${V}\"/; s/versionCode = [0-9]+/versionCode = ${CODE}/" android/app/build.gradle.kts
          grep -n -E 'versionName|versionCode' android/app/build.gradle.kts

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11 for embedded CPython core
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Export Chaquopy Python
        run: echo "CHAQUOPY_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Ensure Android SDK components
        run: |
          set -euo pipefail
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}
          if [ -z "$SDK" ]; then
            echo 'GitHub runner did not expose ANDROID_HOME or ANDROID_SDK_ROOT' >&2
            exit 1
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under runner SDK: $SDK" >&2
            find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          printf 'y\n%.0s' {1..40} | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --verbose \
            "platforms;android-34" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDK=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || { echo "sdkmanager not found: $SDKMANAGER" >&2; exit 1; }
          "$SDKMANAGER" "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=27.0.12077973" >> "$GITHUB_ENV"

      - name: Preflight toolchain & Android environment
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "${ANDROID_NDK_ROOT}"
          test -f android/dastyab-release.keystore
          test -x "${CHAQUOPY_PYTHON}"
          java -version
          "${CHAQUOPY_PYTHON}" --version
          (cd android && bash ./gradlew --version)

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v3-java17-py3.11-ndk27.0.12077973-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Verify Gradle project configuration
        working-directory: android
        run: |
          set -o pipefail
          bash ./gradlew help --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-config.log || {
            status=$?
            grep -n -E "Caused by:|FAILURE:|What went wrong|Could not|No such|not found|failed" gradle-config.log | tail -n 80 || true
            exit "$status"
          }

      - name: Verify Android resources (AAPT2)
        working-directory: android
        run: |
          set -o pipefail
          bash ./gradlew :app:processDebugResources -PskipNativeCheck --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-resources.log || {
            status=$?
            grep -n -E "Caused by:|FAILURE:|ERROR:|AAPT:|What went wrong|not found|failed" gradle-resources.log | tail -n 80 || true
            exit "$status"
          }

      - name: Run Android unit tests
        working-directory: android
        run: |
          set -o pipefail
          bash ./gradlew :app:testDebugUnitTest -PskipNativeCheck --no-daemon --stacktrace --info --console=plain 2>&1 | tee gradle-test.log || {
            status=$?
            grep -n -E "Caused by:|FAILURE:|What went wrong|Could not|No such|not found|failed" gradle-test.log | tail -n 80 || true
            exit "$status"
          }

      - name: Stage native CLI for all Android ABIs
        run: bash scripts/android-build-native.sh android/app/src/main/jniLibs

      - name: Build debug APK with packaged native binaries
        working-directory: android
        run: |
          set -o pipefail
          bash ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-debug.log || {
            status=$?
            grep -n -E "Caused by:|FAILURE:|What went wrong|Could not|No such|not found|failed" gradle-debug.log | tail -n 80 || true
            exit "$status"
          }

      - name: Build signed release APK
        working-directory: android
        run: |
          set -o pipefail
          bash ./gradlew :app:assembleRelease --no-daemon --stacktrace --info --console=plain 2>&1 | tee gradle-release.log || {
            status=$?
            grep -n -E "Caused by:|FAILURE:|What went wrong|Could not|No such|not found|failed" gradle-release.log | tail -n 80 || true
            exit "$status"
          }

      - name: Upload Gradle diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-gradle-failure-logs
          path: android/gradle-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify release APK installability, alignment, ABIs, and signatures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find android/app/build/outputs/apk/release -type f -name '*.apk' -print)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "Expected exactly one release APK, found ${#apks[@]}:" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          APK="${apks[0]}"
          test -f "$APK"
          bash scripts/android-verify-apk.sh "$APK"
          RELEASE_APK="DastYab-android.apk"
          cp "$APK" "$RELEASE_APK"
          test -f "$RELEASE_APK"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"

      - name: Enable emulator KVM access
        run: |
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run instrumentation & release APK install/upgrade/launch tests on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-linux-hw-accel: false
          script: bash scripts/android-emulator-smoke.sh

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dastyab-release-android-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 90
